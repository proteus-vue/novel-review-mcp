# 多平台投稿档案（preset）
# 数据来源：2026 年公开投稿/签约资料整理，仅供评审参考；实际以各平台官方最新公告为准。
# 用法：platform_fit / review_batch 的 platform 参数取本文件的 key。
version: "0.3.0"

defaults:
  must_avoid:
    - 涉政影射
    - 涉黄低俗
    - 可复现犯罪手法
    - 美化违法或校园霸凌
    - 三观严重偏离

platforms:
  qimao:
    name: 七猫免费小说
    model: 免费+广告分成 / 保底双轨
    tone: 强情绪、快节奏、强冲突、开篇抓眼、适配短剧改编
    focus: [现实矛盾, 反转打脸, 升级流, 系统流, 都市, 架空历史]
    review_process: [初审, 复审, 终审]
    review_tip: 初审看大纲/情节走向/平台定位；终审多编辑共评人物与情节；2 个工作日内回复
    hard_window:
      chars_to_conflict: 300
      chars_to_golden_finger: 800
      chars_to_payoff: 2000
    must_have:
      - 开篇强冲突或异常处境
      - 清晰的爽点升级曲线
      - 每 10 章一个小高潮（短剧改编预留点）
    forbidden: [同人, 双男主, 文娱题材]
    min_words_sign: 20000
    note: 男频玄幻开局审稿铁律 300/800/2000；女频重情绪层层递进与记忆点金句

  fanqie:
    name: 番茄小说
    model: 免费+广告/听书分成，算法推荐
    tone: 数据为王、快节奏、强代入感、完读率与追更率导向
    focus: [都市脑洞, 重生, 系统流, 赘婿逆袭, 国运, 短剧向]
    review_process: [机器初筛, 编辑复审, 首秀数据验证]
    metrics:
      completion_rate_good: 0.25
      retention_rate_good: 0.40
    hard_window:
      chars_to_payoff_first3: 2000
      hook_every_chars: 600
    must_have:
      - 黄金三章完成 突发事件+主角困境+金手指+章末钩子
      - 前三章主角做出主动选择（非全程被动承受）
      - 至少一个具象化记忆点
      - 8 万字首秀前保持节奏
    note: 2026-10 起新人（Lv0/Lv1）走完本签约（15万或30万字），评估更看全文质量稳定性；旧"2万字申签"口径已不适用于新人

  qidian:
    name: 起点中文网
    model: 付费订阅，IP 开发能力最强
    tone: 重逻辑、大格局、成长线、东方美学、拒绝无脑爽
    focus: [都市职业, 玄幻系统流, 历史考据, 仙侠, 硬核科幻]
    review_process: [内投或直发, 初审, 交叉审核]
    review_tip: 内投反馈快但需完整大纲；直发门槛低周期长；通过率约 5%-20%
    must_have:
      - 逻辑严谨的成长轨迹
      - 完整且自洽的世界观
      - 职业/史实细节经得起推敲
      - 长线主线与格局
    note: 读者对大长篇有心理预期；付费意愿强；上架后均订是硬指标

  jinjiang:
    name: 晋江文学城
    model: 付费订阅，编辑代理制，IP 影视化强
    tone: 重文笔、强情感、精品化、人物弧光、正向价值
    focus: [古言权谋, 现言职场, 女性成长, 强强CP, 奇幻仙侠]
    review_process: [初审, 复审, 终审（三审三校思路）]
    review_tip: 只看书名/文案/前三章；文笔不过关则字数再多也无用；零容忍抄袭融梗与三观不正
    must_have:
      - 情感真实性与人物刻画
      - 女性独立自强、事业线
      - 逻辑严谨的细节与考据
    forbidden: [恋爱脑, 工具人, 美化校园霸凌, 过度拜金, 躺平摆烂]
    note: 签约年限长（5 年起），签人不签书；红线零容忍

  meituan:
    name: 美团阅读/短剧向（占位模板）
    model: 待补充
    tone: 短剧改编导向、强情节、强钩子
    focus: []
    review_process: [初审, 复审, 终审]
    must_have:
      - 每 10 章一个小高潮
      - 强视觉记忆点
    forbidden: []
    note: 未提供公开评审标准，本档案为占位模板；填入 focus/must_have/forbidden 后即可启用，评审器不会因空配置空跑

# 平台匹配度打分权重（platform_fit 使用）
fit_weights:
  tone_match: 0.30
  must_have_coverage: 0.35
  forbidden_absence: 0.20
  hard_window_coverage: 0.15
