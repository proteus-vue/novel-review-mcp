[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiezhi-review"
version = "0.4.0"
description = "獬豸（Xiezhi）· 小说投稿评审 MCP Server：三审 + 红队 + 头部对标 + 反漂移 + 增量高效"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiezhi contributors"}]
keywords = ["mcp", "novel", "writing", "review", "editorial", "xiezhi", "獬豸"]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/proteus-vue/novel-review-mcp"
Repository = "https://github.com/proteus-vue/novel-review-mcp"
Issues = "https://github.com/proteus-vue/novel-review-mcp/issues"

[project.scripts]
xiezhi-review = "server:main"
novel-review-mcp = "server:main"   # 兼容旧技术标识

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["server", "engine", "layers", "summarizer", "llm", "cache", "config", "facts", "telemetry", "committee", "blind"]

[tool.setuptools.data-files]
"xiezhi_review" = ["src/rules.yaml", "src/platforms.yaml", "src/benchmarks.yaml", "src/prompts.md"]
